name: Reconstruct exact resume

on:
  push:
    paths:
      - '.github/workflows/reconstruct-resume.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct exact PDF
        shell: bash
        run: |
          mkdir -p assets
          cat .resume_chunks/chunk_* | base64 --decode > assets/Juhi_Joshi_AI_Product_Resume.pdf
          test "$(stat -c%s assets/Juhi_Joshi_AI_Product_Resume.pdf)" = "77363"
          echo "8d20a6aa333fd844b9b16251e9587fa59a1718374df9d4d523c98a8698eaff7e  assets/Juhi_Joshi_AI_Product_Resume.pdf" | sha256sum -c -

      - name: Commit exact resume
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Juhi_Joshi_AI_Product_Resume.pdf
          git commit -m "Add exact finalized resume PDF"
          git push

# Triggered after all resume chunks were uploaded.

# All six transfer chunks are now present.
