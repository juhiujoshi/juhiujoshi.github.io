<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 425" role="img" aria-labelledby="t d"><title id="t">Domain-adaptive MRI segmentation conceptual architecture</title><desc id="d">Six-stage conceptual workflow. Based on public-safe descriptions, not a proprietary system diagram.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#18a4a3" stroke-width="1.5"/></marker></defs><style>.node{fill:#142c40;stroke:#42677b;stroke-width:1.4}.num{fill:#54d3c4;font:700 15px Arial,sans-serif;letter-spacing:1px}.main{fill:#f6ffff;font:700 22px Arial,sans-serif}.sub{fill:#bdd6df;font:16px Arial,sans-serif}.arrow{fill:none;stroke:#18a4a3;stroke-width:3;marker-end:url(#arrow);stroke-linecap:round}</style><rect width="1100" height="425" fill="#0d2232" rx="26"/><path d="M337 116 H388" class="arrow"/><path d="M704 116 H755" class="arrow"/><path d="M917 180 V245" class="arrow"/><path d="M763 309 H713" class="arrow"/><path d="M396 309 H346" class="arrow"/><g><rect x="37" y="52" width="292" height="128" rx="19" class="node"/><text x="57" y="84" class="num">01 / STEP</text><text x="57" y="124" class="main">Source MRI</text><text x="57" y="153" class="sub">FLAIR training</text></g><g><rect x="404" y="52" width="292" height="128" rx="19" class="node"/><text x="424" y="84" class="num">02 / STEP</text><text x="424" y="124" class="main">Base network</text><text x="424" y="153" class="sub">U-Net++ model</text></g><g><rect x="771" y="52" width="292" height="128" rx="19" class="node"/><text x="791" y="84" class="num">03 / STEP</text><text x="791" y="124" class="main">Freeze weights</text><text x="791" y="153" class="sub">Fixed segmentation</text></g><g><rect x="771" y="245" width="292" height="128" rx="19" class="node"/><text x="791" y="277" class="num">04 / STEP</text><text x="791" y="317" class="main">Target MRI</text><text x="791" y="346" class="sub">T1 / T2 input</text></g><g><rect x="404" y="245" width="292" height="128" rx="19" class="node"/><text x="424" y="277" class="num">05 / STEP</text><text x="424" y="317" class="main">Learn visual prompt</text><text x="424" y="346" class="sub">Update prompt only</text></g><g><rect x="37" y="245" width="292" height="128" rx="19" class="node"/><text x="57" y="277" class="num">06 / STEP</text><text x="57" y="317" class="main">Segmentation</text><text x="57" y="346" class="sub">Compare predictions</text></g></svg>